name: Build Forge Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install ffmpeg for audio conversion
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert WAV sounds to OGG
        run: |
          if [ -d "src/main/resources/assets/rickmod/sounds" ]; then
            for f in src/main/resources/assets/rickmod/sounds/*.wav; do
              [ -e "$f" ] || continue
              ffmpeg -y -i "$f" -c:a libvorbis -q:a 4 "${f%.wav}.ogg"
              rm "$f"
            done
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Mod JAR
        run: gradle build --no-daemon

      - name: Upload Mod JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rickmod-1.0.0
          path: build/libs/*.jar
